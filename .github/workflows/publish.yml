name: Publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - name: Render training slides
        run: quarto render training_materials

      - name: Assemble site
        run: |
          rsync -a ./ _site/ \
            --exclude '.git*' --exclude '.github/' --exclude '.claude/' \
            --exclude '.quarto/' --exclude '_site/' \
            --exclude 'training_materials/*.qmd' \
            --exclude 'training_materials/*.md' \
            --exclude 'training_materials/_quarto.yml'
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
